apiVersion: v1
kind: Service
metadata:
  name: stick-deathmatch
  annotations:
    # AWS Load Balancer Controller가 설치된 클러스터라면 NLB로 프로비저닝됩니다.
    # (컨트롤러가 없다면 이 annotation을 지우고 기본 in-tree provider가
    #  Classic Load Balancer를 만들도록 두어도 WebSocket은 정상 동작합니다.)
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: stick-deathmatch
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  # 같은 대전방(파드 1개)에 접속을 유지해야 하므로 세션 고정이 필요 없습니다.
  # (replicas=1이기 때문에 트래픽이 갈 곳이 하나뿐입니다.)
