apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: game-cluster
  region: ap-northeast-1
  version: "1.35"

iam:
  withOIDC: true

vpc:
  subnets:
    private:
      ap-northeast-1a: { id: subnet-0a5151f9e756c933c }
      ap-northeast-1c: { id: subnet-0dd860261d9af5002 }

managedNodeGroups:
  - name: game-nodes
    instanceType: t3.medium

    desiredCapacity: 2
    minSize: 2
    maxSize: 2

    privateNetworking: true