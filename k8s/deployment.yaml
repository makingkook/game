apiVersion: apps/v1
kind: Deployment
metadata:
  name: stick-deathmatch
  labels:
    app: stick-deathmatch
spec:
  # 주의: 게임 상태(라운드, 체력, 두 플레이어 매칭)가 프로세스 메모리에만 저장됩니다.
  # replicas를 2개 이상으로 늘리면 두 플레이어가 서로 다른 파드에 매칭되어
  # 대전이 성립하지 않을 수 있습니다. 반드시 1로 유지하세요.
  # (여러 개의 동시 대전방을 지원하려면 Redis 등 외부 상태 저장소로 확장이 필요합니다.)
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stick-deathmatch
  template:
    metadata:
      labels:
        app: stick-deathmatch
    spec:
      containers:
        - name: stick-deathmatch
          # ECR 리포지토리 URI로 교체하세요.
          image: 950274644703.dkr.ecr.ap-northeast-1.amazonaws.com/game:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
